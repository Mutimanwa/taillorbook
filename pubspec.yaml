name: taillorbook
description: "SokoMarket — Marketplace e-commerce (Flutter + Firebase + ImgBB + WhatsApp)."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ---- Backend (Firebase) -------------------------------------------------
  # Auth (email/mot de passe, rôles) + base de données temps réel.
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0

  # ---- État & navigation --------------------------------------------------
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # ---- Réseau & médias ----------------------------------------------------
  # Client HTTP (upload ImgBB), sélection d'image produit, cache d'images,
  # ouverture de WhatsApp / liens externes.
  dio: ^5.7.0
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1

  # ---- Utilitaires --------------------------------------------------------
  shared_preferences: ^2.3.4
  intl: ^0.20.0
  uuid: ^4.5.1
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
